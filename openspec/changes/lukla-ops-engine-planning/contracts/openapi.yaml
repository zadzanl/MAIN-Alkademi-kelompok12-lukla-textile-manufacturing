    TransactionId: {name: transactionId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    LineId: {name: lineId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    PeriodId: {name: periodId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
