openapi: 3.1.0
info:
  title: Lukla Operations Engine API
  version: 1.0.0-contract
  description: Portable contract-first API. Planning artifact; no runtime conformance is claimed.
servers: [{url: https://api.example.invalid/api/v1}]
security: [{bearerAuth: []}]
x-planning-status: PROPOSED_NOT_RUNTIME_VERIFIED
x-operation-templates:
  read: &read
    tags: [workflow]
    x-source-ids: [FR-1.1]
    x-roles: [Owner, ProductionHead, FinancePayroll]
    x-view: [VIEW-01]
    x-invariant: Authenticated scope and operation capability are rechecked; inaccessible IDs return 404.
    responses: &readResponses
      '200': {description: Success}
      '401': {$ref: '#/components/responses/AuthRequired'}
      '403': {$ref: '#/components/responses/Forbidden'}
      '404': {$ref: '#/components/responses/NotFound'}
      '422': {$ref: '#/components/responses/ValidationError'}
  write: &write
    tags: [workflow]
    x-source-ids: [FR-3.1]
    x-roles: [Owner]
    x-view: [VIEW-01]
    x-invariant: Atomic mutation with audit and idempotency; new capability requires approved business permission.
    parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
    responses: &writeResponses
      '200': {description: Success}
      '401': {$ref: '#/components/responses/AuthRequired'}
      '403': {$ref: '#/components/responses/Forbidden'}
      '404': {$ref: '#/components/responses/NotFound'}
      '409': {$ref: '#/components/responses/Conflict'}
      '422': {$ref: '#/components/responses/ValidationError'}
tags: [{name: auth}, {name: clients-orders}, {name: ledger-audit}, {name: samples-rates}, {name: warehouse-cutting}, {name: sewing}, {name: quality-payroll}, {name: procurement}, {name: files-portal}, {name: jobs-search}]
paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      summary: Start bearer session
      x-source-ids: [FR-2.1]
      x-roles: [Owner, SampleTeam, Warehouse, ProductionHead, Tailor, QCInspector, FinancePayroll, MaklonClient]
      x-view: [all]
      x-invariant: Authenticate before deriving tenant, legal-owner, and beneficiary scopes.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}}
      responses: {'200': {description: Session, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}, '401': {$ref: '#/components/responses/AuthRequired'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      security: []
      summary: Rotate refresh token
      x-source-ids: [FR-2.1]
      x-roles: [Authenticated]
      x-view: [all]
      x-invariant: Refresh tokens are opaque, rotating, and revocable.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RefreshRequest'}}}}
      responses: {'200': {description: Session, content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}}, '401': {$ref: '#/components/responses/AuthRequired'}}
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke refresh session
      x-source-ids: [FR-2.1]
      x-roles: [Authenticated]
      x-view: [all]
      x-invariant: Logout is idempotent.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RefreshRequest'}}}}
      responses: {'204': {description: Revoked}, '401': {$ref: '#/components/responses/AuthRequired'}}
  /me/context:
    get:
      tags: [auth]
      operationId: getMyContext
      summary: Return server-derived scopes
      x-source-ids: [FR-1.1, FR-2.1]
      x-roles: [Authenticated]
      x-view: [all]
      x-invariant: Caller tenant headers are never authorization.
      responses: {'200': {description: Context, content: {application/json: {schema: {$ref: '#/components/schemas/ActorContext'}}}}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/Forbidden'}}
  /clients:
    get:
      <<: *read
      operationId: listClients
      responses:
        <<: *readResponses
        '200': {description: Clients, content: {application/json: {schema: {$ref: '#/components/schemas/ClientPage'}}}}
    post:
      tags: [clients-orders]
      operationId: createClient
      summary: Create client tenant
      x-source-ids: [FR-1.1, FR-1.4]
      x-roles: [Owner]
      x-view: [VIEW-01]
      x-invariant: FR-1.4 is definition-pending; only known onboarding fields are recorded.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ClientRequest'}}}}
      responses: {'201': {description: Client, content: {application/json: {schema: {$ref: '#/components/schemas/Client'}}}}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /clients/{clientId}:
    get:
      <<: *read
      operationId: getClient
      summary: Get client profile detail
      tags: [clients-orders]
      x-roles: [Owner, FinancePayroll, SampleTeam]
      x-source-ids: [FR-1.1]
      x-view: [VIEW-01, VIEW-06]
      x-invariant: Client profile contains legal entity and consignment metadata.
      parameters:
        - {$ref: '#/components/parameters/ClientId'}
      responses:
        <<: *readResponses
        '200': {description: Client profile, content: {application/json: {schema: {$ref: '#/components/schemas/Client'}}}}
  /orders:
    post:
      tags: [clients-orders]
      operationId: createOrder
      summary: Create order with explicit scheme and beneficiary
      x-source-ids: [FR-1.1, FR-1.4]
      x-roles: [Owner]
      x-view: [VIEW-01, VIEW-03]
      x-invariant: Tenant access, legal title, and beneficiary are separate.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OrderRequest'}, example: {orderNumber: SO-2026-001, beneficiaryTenantId: 11111111-1111-4111-8111-111111111111, scheme: SEMI_CMT, timezone: Asia/Jakarta, cutoffLocal: '12:00:00'}}}}
      responses: {'201': {description: Order, content: {application/json: {schema: {$ref: '#/components/schemas/Order'}}}}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}}
    get:
      tags: [clients-orders]
      operationId: listOrders
      summary: List scoped orders
      x-source-ids: [FR-1.1]
      x-roles: [Owner, ProductionHead, Warehouse, FinancePayroll, MaklonClient]
      x-view: [VIEW-01, VIEW-03, VIEW-06]
      x-invariant: RLS filters tenant and beneficiary scope.
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {description: Orders, content: {application/json: {schema: {$ref: '#/components/schemas/OrderPage'}}}}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/Forbidden'}}
  /orders/{orderId}:
    get:
      tags: [clients-orders]
      operationId: getOrder
      summary: Read scoped order
      x-source-ids: [FR-1.1, FR-1.4]
      x-roles: [Owner, ProductionHead, Warehouse, FinancePayroll, MaklonClient]
      x-view: [VIEW-01, VIEW-03, VIEW-06]
      x-invariant: Inaccessible rows return 404 without leakage.
      parameters: [{$ref: '#/components/parameters/OrderId'}]
      responses: {'200': {description: Order, content: {application/json: {schema: {$ref: '#/components/schemas/Order'}}}}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}
  /orders/{orderId}/confirmation:
    post:
      <<: *write
      operationId: confirmOrder
      summary: Confirm a draft order to lock production commitments
      tags: [clients-orders]
      x-roles: [Owner, ProductionHead]
      x-source-ids: [FR-1.1, FR-4.3]
      x-view: [VIEW-01, VIEW-03]
      x-invariant: Transitions order from DRAFT to CONFIRMED before material issuance.
      parameters:
        - {$ref: '#/components/parameters/OrderId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderConfirmationRequest'}
      responses:
        <<: *writeResponses
        '200': {description: Confirmed order, content: {application/json: {schema: {$ref: '#/components/schemas/Order'}}}}
  /orders/{orderId}/cancellation:
    post:
      <<: *write
      operationId: cancelOrder
      summary: Cancel an order with required audit justification
      tags: [clients-orders]
      x-roles: [Owner]
      x-source-ids: [FR-1.1]
      x-view: [VIEW-01]
      x-invariant: Cancelling an order halts production and requires reason for audit log.
      parameters:
        - {$ref: '#/components/parameters/OrderId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderCancellationRequest'}
      responses:
        <<: *writeResponses
        '200': {description: Cancelled order, content: {application/json: {schema: {$ref: '#/components/schemas/Order'}}}}
  /ledger/transactions:
    post:
      tags: [ledger-audit]
      operationId: appendLedgerTransaction
      summary: Append balanced transaction
      x-source-ids: [FR-3.1]
      x-roles: [Owner, FinancePayroll]
      x-view: [VIEW-06]
      x-invariant: Equal debit and credit totals; posted rows cannot update or delete.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LedgerRequest'}, example: {transactionType: CUSTODIAL_RECEIPT, currency: IDR, entries: [{accountCode: CUSTODIAL_MATERIAL, direction: DEBIT, amountMinor: 1000000}, {accountCode: CUSTODIAL_OBLIGATION, direction: CREDIT, amountMinor: 1000000}]}}}}
      responses: {'201': {description: Posted transaction, content: {application/json: {schema: {$ref: '#/components/schemas/LedgerTransaction'}}}}, '400': {$ref: '#/components/responses/ValidationError'}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}}
  /ledger/transactions/{transactionId}/reversals:
    post:
      tags: [ledger-audit]
      operationId: reverseLedgerTransaction
      summary: Append compensating reversal
      x-source-ids: [FR-3.1]
      x-roles: [Owner, FinancePayroll]
      x-view: [VIEW-06]
      x-invariant: Reversal creates a new balanced transaction and never edits its source.
      parameters: [{$ref: '#/components/parameters/TransactionId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReversalRequest'}}}}
      responses: {'201': {description: Reversal, content: {application/json: {schema: {$ref: '#/components/schemas/LedgerTransaction'}}}}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}, '409': {$ref: '#/components/responses/Conflict'}}
  /ledger/entries:
    get:
      tags: [ledger-audit]
      operationId: getLedgerEntries
      summary: Read scoped ledger
      x-source-ids: [FR-3.1]
      x-roles: [Owner, FinancePayroll]
      x-view: [VIEW-06]
      x-invariant: Read-only and RLS scoped.
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {description: Ledger, content: {application/json: {schema: {$ref: '#/components/schemas/LedgerPage'}}}}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/Forbidden'}}
  /ledger/accounts:
    get:
      <<: *read
      operationId: listLedgerAccounts
      summary: List chart of accounts for double-entry journals
      tags: [ledger-audit]
      x-roles: [FinancePayroll, Owner]
      x-source-ids: [FR-3.1]
      x-view: [VIEW-06]
      x-invariant: Accounts define valid debit and credit legs; chart is read-only.
      parameters:
        - {name: active, in: query, required: false, schema: {type: boolean}}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        <<: *readResponses
        '200': {description: Ledger accounts list, content: {application/json: {schema: {$ref: '#/components/schemas/LedgerAccountPage'}}}}
  /ledger/transactions/{transactionId}:
    get:
      <<: *read
      operationId: getLedgerTransaction
      summary: Get posted ledger transaction header and legs
      tags: [ledger-audit]
      x-roles: [FinancePayroll, Owner]
      x-source-ids: [FR-3.1]
      x-view: [VIEW-06]
      x-invariant: Immutable transaction header and balanced entries; reversals reference original ID.
      parameters:
        - {$ref: '#/components/parameters/TransactionId'}
      responses:
        <<: *readResponses
        '200': {description: Ledger transaction detail, content: {application/json: {schema: {$ref: '#/components/schemas/LedgerTransaction'}}}}
  /audit/events:
    get:
      tags: [ledger-audit]
      operationId: listAuditEvents
      summary: Read append-only audit events
      x-source-ids: [FR-3.1]
      x-roles: [Owner, FinancePayroll]
      x-view: [VIEW-01, VIEW-06]
      x-invariant: Audit scope is bounded by validated grants.
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {description: Audit, content: {application/json: {schema: {$ref: '#/components/schemas/AuditPage'}}}}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/Forbidden'}}
  /samples:
    post:
      tags: [samples-rates]
      operationId: createSample
      summary: Create sample lifecycle
      x-source-ids: [FR-4.1]
      x-roles: [Owner, SampleTeam]
      x-view: [VIEW-02]
      x-invariant: Sample history is append-only.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SampleRequest'}}}}
      responses: {'201': {description: Sample, content: {application/json: {schema: {$ref: '#/components/schemas/Sample'}}}}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /samples/{sampleId}:
    get:
      <<: *read
      operationId: getSample
      summary: Get sample detail and current active revision metadata
      tags: [samples-rates]
      x-roles: [SampleTeam, Owner, ProductionHead]
      x-source-ids: [FR-4.1, FR-4.2]
      x-view: [VIEW-02]
      x-invariant: Exposes current status and approved revision for sample development.
      parameters:
        - {$ref: '#/components/parameters/SampleId'}
      responses:
        <<: *readResponses
        '200': {description: Sample detail, content: {application/json: {schema: {$ref: '#/components/schemas/Sample'}}}}
  /samples/{sampleId}/revisions:
    get:
      tags: [samples-rates]
      operationId: listSampleRevisions
      summary: List sample revisions
      x-source-ids: [FR-4.1]
      x-roles: [Owner, SampleTeam, ProductionHead, MaklonClient]
      x-view: [VIEW-02]
      x-invariant: Locked revisions cannot be rewritten.
      parameters: [{$ref: '#/components/parameters/SampleId'}]
      responses: {'200': {description: Revisions, content: {application/json: {schema: {$ref: '#/components/schemas/RevisionPage'}}}}, '401': {$ref: '#/components/responses/AuthRequired'}, '404': {$ref: '#/components/responses/NotFound'}}
    post:
      tags: [samples-rates]
      operationId: createSampleRevision
      summary: Add sample revision
      x-source-ids: [FR-4.1]
      x-roles: [SampleTeam]
      x-view: [VIEW-02]
      x-invariant: Revision number is unique per sample.
      parameters: [{$ref: '#/components/parameters/SampleId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RevisionRequest'}}}}
      responses: {'201': {description: Revision, content: {application/json: {schema: {$ref: '#/components/schemas/Revision'}}}}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}}
  /samples/{sampleId}/lock:
    post:
      tags: [samples-rates]
      operationId: lockSample
      summary: Lock approved sample revision
      x-source-ids: [FR-4.3]
      x-roles: [Owner, SampleTeam]
      x-view: [VIEW-02]
      x-invariant: Lock is one-way and mass orders inherit the locked revision.
      parameters: [{$ref: '#/components/parameters/SampleId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LockRequest'}}}}
      responses: {'200': {description: Locked sample, content: {application/json: {schema: {$ref: '#/components/schemas/Sample'}}}}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/InvalidState'}}
  /time-studies:
    post:
      tags: [samples-rates]
      operationId: recordTimeStudy
      summary: Record component time study
      x-source-ids: [FR-4.2]
      x-roles: [SampleTeam, ProductionHead]
      x-view: [VIEW-02]
      x-invariant: Duration and quantity are positive precise values.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TimeStudyRequest'}}}}
      responses: {'201': {description: Time study, content: {application/json: {schema: {$ref: '#/components/schemas/TimeStudy'}}}}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/Forbidden'}, '422': {$ref: '#/components/responses/ValidationError'}}
    get:
      <<: *read
      operationId: listTimeStudies
      summary: List stopwatch time study observations for sample revisions
      tags: [samples-rates]
      x-roles: [SampleTeam, Owner, ProductionHead]
      x-source-ids: [FR-4.2]
      x-view: [VIEW-02]
      x-invariant: Time studies benchmark standard allowed minutes (SAM) per component.
      parameters:
        - {name: sampleRevisionId, in: query, required: false, schema: {$ref: '#/components/schemas/Uuid'}}
        - {name: componentCode, in: query, required: false, schema: {type: string}}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        <<: *readResponses
        '200': {description: Time study observations, content: {application/json: {schema: {$ref: '#/components/schemas/TimeStudyPage'}}}}
  /rate-cards:
    put:
      tags: [samples-rates]
      operationId: upsertRateCard
      summary: Set effective component rate
      x-source-ids: [FR-4.2, FR-7.2]
      x-roles: [Owner, ProductionHead]
      x-view: [VIEW-02, VIEW-06]
      x-invariant: A unit receives one immutable rate snapshot.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RateCardRequest'}}}}
      responses: {'200': {description: Rate card, content: {application/json: {schema: {$ref: '#/components/schemas/RateCard'}}}}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}}
  /material-receipts:
    post:
      tags: [warehouse-cutting]
      operationId: receiveMaterial
      summary: Receive owned or custodial material
      x-source-ids: [FR-5, FR-5.1, FR-5.2]
      x-roles: [Warehouse, Owner]
      x-view: [VIEW-03]
      x-invariant: Legal owner and order beneficiary are required; custody does not transfer title.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MaterialReceiptRequest'}, example: {legalStockOwnerId: 11111111-1111-4111-8111-111111111111, orderBeneficiaryId: 22222222-2222-4222-8222-222222222222, orderId: 33333333-3333-4333-8333-333333333333, scheme: SEMI_CMT, sku: TRIM-01, quantity: {value: '12.500', unit: METER}}}}}
      responses: {'201': {description: Material lot, content: {application/json: {schema: {$ref: '#/components/schemas/MaterialLot'}}}}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /material-issuances:
    post:
      tags: [warehouse-cutting]
      operationId: issueMaterial
      summary: Issue material to cutting/order
      x-source-ids: [FR-6, FR-6.2]
      x-roles: [Warehouse, Owner]
      x-view: [VIEW-03]
      x-invariant: validate_material_dispatch locks lot/order and rejects mismatch before decrement.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MaterialIssueRequest'}}}}
      responses: {'201': {description: Movement, content: {application/json: {schema: {$ref: '#/components/schemas/StockMovement'}}}}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}}
  /stock:
    get:
      tags: [warehouse-cutting]
      operationId: getStock
      summary: Read scoped stock
      x-source-ids: [FR-5, FR-6.1]
      x-roles: [Owner, Warehouse, MaklonClient]
      x-view: [VIEW-03]
      x-invariant: RLS filters legal owner and beneficiary scope.
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/PageSize'}]
      responses: {'200': {description: Stock, content: {application/json: {schema: {$ref: '#/components/schemas/StockPage'}}}}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/Forbidden'}}
  /stocktakes:
    post:
      tags: [warehouse-cutting]
      operationId: createStocktake
      summary: Record stocktake observation
      x-source-ids: [FR-6.1]
      x-roles: [Warehouse, Owner]
      x-view: [VIEW-03]
      x-invariant: Observation is append-only; correction is compensating.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StocktakeRequest'}}}}
      responses: {'201': {description: Stocktake, content: {application/json: {schema: {$ref: '#/components/schemas/Stocktake'}}}}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}}
  /stock-adjustments:
    post:
      tags: [warehouse-cutting]
      operationId: createStockAdjustment
      summary: Record authorized stock correction
      x-source-ids: [FR-6.1]
      x-roles: [Owner, Warehouse]
      x-view: [VIEW-03, VIEW-06]
      x-invariant: No movement is deleted or rewritten.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StockAdjustmentRequest'}}}}
      responses: {'201': {description: Adjustment, content: {application/json: {schema: {$ref: '#/components/schemas/StockMovement'}}}}, '401': {$ref: '#/components/responses/AuthRequired'}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}}
  /cutting-results:
    post:
      tags: [warehouse-cutting]
      operationId: recordCuttingResult
      summary: Record cut units and waste
      x-source-ids: [FR-6, FR-6.3]
      x-roles: [ProductionHead, Warehouse, Owner]
      x-view: [VIEW-03, VIEW-01]
      x-invariant: Cut plus waste cannot exceed issued quantity.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CuttingResultRequest'}}}}
