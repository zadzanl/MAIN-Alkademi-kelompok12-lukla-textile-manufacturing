  # ─── GAP-FIX 2: Stopwatch Time Study Sessions ─────────────────────────────
  /time-study-sessions:
    post:
      tags: [samples-rates]
      operationId: createTimeStudySession
      summary: Open a stopwatch session for one component
      x-source-ids: [FR-4.2]
      x-roles: [SampleTeam, ProductionHead]
      x-view: [VIEW-02]
      x-invariant: Only one OPEN session allowed per (revision, component) at a time. Starting a new session while one is open returns 409 INVALID_STATE.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TimeStudySessionRequest'}}}}
      responses:
        '201': {description: Opened session, content: {application/json: {schema: {$ref: '#/components/schemas/TimeStudySession'}}}}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/InvalidState'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /time-study-sessions/{sessionId}/observations:
    post:
      tags: [samples-rates]
      operationId: addTimeStudyObservation
      summary: Record one stopwatch lap (tap stop)
      x-source-ids: [FR-4.2]
      x-roles: [SampleTeam, ProductionHead]
      x-view: [VIEW-02]
      x-invariant: Session must be OPEN. observedDurationMs > 0. ratingFactor defaults to 100 (normal pace). Append-only.
      parameters:
        - {name: sessionId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ObservationRequest'}, example: {observedDurationMs: 47300, ratingFactor: 100, excludeFlag: false}}}}
      responses:
        '201': {description: Recorded observation, content: {application/json: {schema: {$ref: '#/components/schemas/Observation'}}}}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/InvalidState'}
  /time-study-sessions/{sessionId}/observations/{observationId}/exclude:
    post:
      tags: [samples-rates]
      operationId: excludeObservation
      summary: Mark an outlier observation as excluded from SMV calculation
      x-source-ids: [FR-4.2]
      x-roles: [SampleTeam, ProductionHead]
      x-view: [VIEW-02]
      x-invariant: Session must be OPEN. Does not delete — sets exclude_flag=true with mandatory reason. Excluded observations remain in audit history.
      parameters:
        - {name: sessionId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
        - {name: observationId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExcludeObservationRequest'}}}}
      responses:
        '200': {description: Updated observation, content: {application/json: {schema: {$ref: '#/components/schemas/Observation'}}}}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/InvalidState'}
  /time-study-sessions/{sessionId}/finalize:
    post:
      tags: [samples-rates]
      operationId: finalizeTimeStudySession
      summary: Calculate SMV from observations and close the session
      x-source-ids: [FR-4.2]
      x-roles: [SampleTeam, ProductionHead]
      x-view: [VIEW-02]
      x-invariant: Requires at least 3 non-excluded observations. Calculates SMV = (mean of non-excluded basic times × ratingFactor/100) × (1 + allowanceFraction). Creates a time_studies record linked to this session. Session transitions to FINALIZED and becomes immutable.
      parameters:
        - {name: sessionId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/FinalizeSessionRequest'}, example: {method: MEAN_RATING_FACTOR, allowanceFraction: '0.15'}}}}
      responses:
        '200': {description: Finalized session with calculated SMV, content: {application/json: {schema: {$ref: '#/components/schemas/TimeStudySession'}}}}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/InvalidState'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /time-study-sessions/{sessionId}/abandon:
    post:
      tags: [samples-rates]
      operationId: abandonTimeStudySession
      summary: Discard an OPEN session without creating a time study record
      x-source-ids: [FR-4.2]
      x-roles: [SampleTeam, ProductionHead]
      x-view: [VIEW-02]
      x-invariant: Session transitions to ABANDONED. Observations are retained in audit history but excluded from SMV. A new OPEN session for the same component may then be started.
      parameters:
        - {name: sessionId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AbandonRequest'}}}}
      responses:
        '200': {description: Abandoned session, content: {application/json: {schema: {$ref: '#/components/schemas/TimeStudySession'}}}}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/InvalidState'}
  /samples/{sampleId}/revisions/{revisionId}/time-study-sessions:
    get:
      tags: [samples-rates]
      operationId: listTimeStudySessions
      summary: List all time study sessions for a revision (all statuses)
      x-source-ids: [FR-4.2]
      x-roles: [Owner, SampleTeam, ProductionHead]
      x-view: [VIEW-02]
      x-invariant: Returns sessions in created_at descending order. OPEN, FINALIZED, and ABANDONED sessions all visible to authorized roles.
      parameters:
        - {$ref: '#/components/parameters/SampleId'}
        - {$ref: '#/components/parameters/RevisionId'}
        - {name: status, in: query, required: false, schema: {type: string, enum: [OPEN, FINALIZED, ABANDONED]}}
      responses:
        '200': {description: Sessions list, content: {application/json: {schema: {$ref: '#/components/schemas/TimeStudySessionPage'}}}}
        '401': {$ref: '#/components/responses/AuthRequired'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
