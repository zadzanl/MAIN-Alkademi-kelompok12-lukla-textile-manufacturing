    # ─── GAP-FIX 1 Schemas: BOM per Revision ────────────────────────────────
    BomItemRequest:
      type: object
      required: [sku, materialDescription, quantity, unit, category]
      properties:
        sku: {type: string, minLength: 1, maxLength: 100, description: Kode material, unik per revisi}
        materialDescription: {type: string, minLength: 1, maxLength: 300, description: 'Nama/deskripsi material. Contoh: Kain TC 65/35 220gsm warna navy'}
        quantity: {$ref: '#/components/schemas/Quantity'}
        unit: {type: string, enum: [METER, PIECE, KILOGRAM, ROLL]}
        category: {type: string, enum: [MAIN_FABRIC, LINING, INTERLINING, TRIM, ACCESSORY, THREAD, OTHER]}
        supplierRef: {type: string, maxLength: 200, nullable: true, description: Referensi supplier opsional}
        sortOrder: {type: integer, minimum: 0, default: 0}
    BomItem:
      allOf:
        - {$ref: '#/components/schemas/BomItemRequest'}
        - type: object
          required: [id, sampleRevisionId]
          properties:
            id: {$ref: '#/components/schemas/Uuid'}
            sampleRevisionId: {$ref: '#/components/schemas/Uuid'}
    BomItemPage: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/BomItem'}}, nextCursor: {type: string, nullable: true}}}
    SmvComponentEntry:
      type: object
      required: [componentCode, smvMs, observationCount, method, completionStatus]
      properties:
        componentCode: {type: string}
        smvMs: {type: integer, minimum: 0, description: Standard Minute Value dalam milidetik}
        smvFormatted: {type: string, description: 'SMV dalam format MM:SS.mmm untuk display. Contoh: 00:47.3'}
        observationCount: {type: integer, minimum: 0}
        method: {type: string, enum: [MEAN_RATING_FACTOR, MEDIAN, DIRECT_ENTRY]}
        completionStatus: {type: string, enum: [COMPLETE, MISSING, PARTIAL], description: 'COMPLETE = ada finalized session atau direct entry. MISSING = belum ada data sama sekali. PARTIAL = ada OPEN session tapi belum finalized.'}
    SmvSummary:
      type: object
      required: [sampleRevisionId, components, totalSmvMs, overallCompletionStatus]
      properties:
        sampleRevisionId: {$ref: '#/components/schemas/Uuid'}
        components: {type: array, items: {$ref: '#/components/schemas/SmvComponentEntry'}}
        totalSmvMs: {type: integer, minimum: 0, description: Total SMV semua komponen dalam milidetik}
        totalSmvFormatted: {type: string, description: 'Total SMV format MM:SS. Contoh: 08:23.7'}
        overallCompletionStatus: {type: string, enum: [COMPLETE, PARTIAL, MISSING]}
    # ─── GAP-FIX 2 Schemas: Stopwatch Sessions ───────────────────────────────
    TimeStudySessionRequest:
      type: object
      required: [sampleRevisionId, componentCode, method]
      properties:
        sampleRevisionId: {$ref: '#/components/schemas/Uuid'}
        componentCode: {type: string, minLength: 1, maxLength: 100}
        operatorRef: {type: string, maxLength: 200, nullable: true, description: Nama atau kode penjahit yang diukur (opsional, untuk konteks)}
        method: {type: string, enum: [MEAN_RATING_FACTOR, MEDIAN], description: 'Metode kalkulasi SMV yang akan digunakan saat finalisasi'}
    TimeStudySession:
      allOf:
        - {$ref: '#/components/schemas/TimeStudySessionRequest'}
        - type: object
          required: [id, status, observationCount]
          properties:
            id: {$ref: '#/components/schemas/Uuid'}
            status: {type: string, enum: [OPEN, FINALIZED, ABANDONED]}
            observationCount: {type: integer, minimum: 0}
            finalizedSmvMs: {type: integer, nullable: true, description: Diisi setelah FINALIZED}
            finalizedSmvFormatted: {type: string, nullable: true, description: 'Format MM:SS.mmm, diisi setelah FINALIZED'}
            createdAt: {$ref: '#/components/schemas/Timestamp'}
            finalizedAt: {$ref: '#/components/schemas/Timestamp', nullable: true}
    TimeStudySessionPage: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/TimeStudySession'}}, nextCursor: {type: string, nullable: true}}}
    ObservationRequest:
      type: object
      required: [observedDurationMs]
      properties:
        observedDurationMs: {type: integer, minimum: 1, description: Durasi observasi dalam milidetik (hasil tekan tombol STOP)}
        ratingFactor: {type: integer, minimum: 50, maximum: 150, default: 100, description: 'Faktor kecepatan operator: 100 = normal, 120 = lebih cepat dari standar, 80 = lebih lambat'}
        excludeFlag: {type: boolean, default: false}
        excludeReason: {type: string, maxLength: 500, nullable: true}
    Observation:
      allOf:
        - {$ref: '#/components/schemas/ObservationRequest'}
        - type: object
          required: [id, sessionId, sequenceNo, capturedAt]
          properties:
            id: {$ref: '#/components/schemas/Uuid'}
            sessionId: {$ref: '#/components/schemas/Uuid'}
            sequenceNo: {type: integer, minimum: 1}
            basicTimeMs: {type: integer, description: 'observedDurationMs × (ratingFactor/100). Dihitung server-side.'}
            capturedAt: {$ref: '#/components/schemas/Timestamp'}
    ExcludeObservationRequest:
      type: object
      required: [excludeReason]
      properties:
        excludeReason: {type: string, minLength: 5, maxLength: 500, description: Wajib diisi saat menandai outlier}
    FinalizeSessionRequest:
      type: object
      required: [method]
      properties:
        method: {type: string, enum: [MEAN_RATING_FACTOR, MEDIAN]}
        allowanceFraction: {type: string, pattern: '^0(\.[0-9]{1,4})?$', default: '0.15', description: 'Persentase allowance (istirahat, personal, fatigue) dalam bentuk desimal. Default 0.15 = 15%.'}
    AbandonRequest:
      type: object
      properties:
        reason: {type: string, maxLength: 500}
    # ─── GAP-FIX 3 Schemas: Fitting Notes & Tech Pack Attachments ────────────
    RevisionNoteRequest:
      type: object
      required: [noteType, body]
      properties:
        noteType: {type: string, enum: [FITTING_NOTE, CHANGE_REASON, CLIENT_FEEDBACK, INTERNAL_MEMO]}
        body: {type: string, minLength: 5, maxLength: 5000, description: 'Isi catatan. Contoh untuk FITTING_NOTE: Kerah kurang lebar 1.5cm berdasarkan feedback fitting tanggal 2026-10-14 menggunakan manekin fit-01.'}
    RevisionNote:
      allOf:
        - {$ref: '#/components/schemas/RevisionNoteRequest'}
        - type: object
          required: [id, sampleRevisionId, createdBy, createdAt]
          properties:
            id: {$ref: '#/components/schemas/Uuid'}
            sampleRevisionId: {$ref: '#/components/schemas/Uuid'}
            createdBy: {$ref: '#/components/schemas/Uuid'}
            createdAt: {$ref: '#/components/schemas/Timestamp'}
    RevisionNotePage: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/RevisionNote'}}, nextCursor: {type: string, nullable: true}}}
    RevisionAttachmentRequest:
      type: object
      required: [fileObjectId, attachmentType]
      properties:
        fileObjectId: {$ref: '#/components/schemas/Uuid'}
        attachmentType: {type: string, enum: [TECH_PACK, SKETCH, PHOTO, MEASUREMENT_SHEET, OTHER]}
        label: {type: string, maxLength: 200, nullable: true, description: 'Label deskriptif opsional. Contoh: Tech Pack v2 — Kemeja Polo Snohund'}
    RevisionAttachment:
      allOf:
        - {$ref: '#/components/schemas/RevisionAttachmentRequest'}
        - type: object
          required: [id, sampleRevisionId, createdAt]
          properties:
            id: {$ref: '#/components/schemas/Uuid'}
            sampleRevisionId: {$ref: '#/components/schemas/Uuid'}
            fileName: {type: string}
            contentType: {type: string}
            sizeBytes: {type: integer}
            createdAt: {$ref: '#/components/schemas/Timestamp'}
    RevisionAttachmentPage: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/RevisionAttachment'}}, nextCursor: {type: string, nullable: true}}}
