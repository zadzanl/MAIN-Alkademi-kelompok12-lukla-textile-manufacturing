        '200': {description: Issued invoice, content: {application/json: {schema: {$ref: '#/components/schemas/ClientInvoice'}}}}
  /files/{fileId}/download:
    get:
      <<: *read
      operationId: getFileDownload
      x-roles: [Authenticated]
      x-source-ids: [FR-1.1, FR-3.1]
      x-view: [all]
      x-invariant: Recheck current source ACL and verified hash; URL expires in at most 300 seconds, no public bucket.
      parameters: [{name: fileId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}]
      responses:
        <<: *readResponses
        '200': {description: Short-lived download capability, content: {application/json: {schema: {$ref: '#/components/schemas/Download'}}}}
  /jobs/{jobId}:
    get:
      <<: *read
      operationId: getJob
      x-roles: [Owner, FinancePayroll]
      x-source-ids: [FR-10.1, FR-10.4]
      x-view: [VIEW-06]
      parameters: [{name: jobId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}]
      responses:
        <<: *readResponses
        '200': {description: Durable job status, content: {application/json: {schema: {$ref: '#/components/schemas/JobAccepted'}}}}
components:
  securitySchemes:
