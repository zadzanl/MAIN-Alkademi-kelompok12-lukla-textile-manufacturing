name: Prototype Quality Checks (Sampling & Spec R&D)

on:
  pull_request:
    paths:
      - 'prototypes/sampling-spec-rnd/**'
      - '.github/workflows/prototype-sampling.yml'
    branches: [ main, master ]
  push:
    paths:
      - 'prototypes/sampling-spec-rnd/**'
      - '.github/workflows/prototype-sampling.yml'
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-quality:
    name: Backend Quality (Ruff & Mypy) [Advisory]
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: prototypes/sampling-spec-rnd/backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: prototypes/sampling-spec-rnd/backend/requirements-dev.txt

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff Linter Check
        run: ruff check src/

      - name: Ruff Format Check
        run: ruff format --check src/

      - name: Mypy Type Check
        run: mypy src/ --strict

  frontend-quality:
    name: Frontend Quality (TypeScript & Lint) [Advisory]
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: prototypes/sampling-spec-rnd/frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: npm install

      - name: TypeScript Type Check
        run: npm run type-check

      - name: ESLint Check
        run: npm run lint
