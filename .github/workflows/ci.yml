name: Core CI Pipeline

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workspace-hygiene:
    name: Workspace Root & Sandbox Isolation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Workspace Hygiene Check
        run: python scripts/check_workspace_hygiene.py

  contract-validation:
    name: OpenAPI & Blueprint Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Contract Validation Dependencies
        run: pip install pyyaml jsonschema referencing

      - name: Validate OpenAPI 3.1 Blueprint Contract
        run: python openspec/changes/lukla-ops-engine-planning/validate-blueprint.py

  payroll-engine-quality:
    name: Payroll Engine Static Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/payroll-costing
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/payroll-costing/requirements-dev.txt

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff Linter Check
        run: ruff check .

      - name: Ruff Format Check
        run: ruff format --check .

      - name: Mypy Type Check
        run: mypy src/ --strict

      - name: Pytest
        run: pytest -q

